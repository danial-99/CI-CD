name: CI/CD Pipeline

on:
  push:
    branches: [ "dev", "stage", "prod" ]
  pull_request:
    branches: [ "dev", "stage", "prod" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: |
        IMAGE_NAME=my-app:${GITHUB_SHA}
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

    - name: Set Kubernetes namespace
      run: |
        if [ "${GITHUB_REF##*/}" = "dev" ]; then
          NAMESPACE=dev
        elif [ "${GITHUB_REF##*/}" = "stage" ]; then
          NAMESPACE=stage
        else
          NAMESPACE=prod
        fi
        echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV

    - name: Configure kubectl
      run: |
        # Assume your kubeconfig is set as a secret
        echo "${{ secrets.KUBECONFIG_CONTENT }}" > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        kubectl config use-context kind-cicd-cluster

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/deployment.yaml -n $NAMESPACE
        kubectl apply -f k8s/service.yaml -n $NAMESPACE
