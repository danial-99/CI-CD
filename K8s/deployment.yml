apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
        - name: landing-page
          image: landing-page:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
